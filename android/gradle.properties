# Project-wide Gradle settings

# Gradle
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=8

# Kotlin
kotlin.code.style=official
kotlin.jvm.target=11

# Android
android.useNewApkStructure=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.enableNonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34
android.enableCompose=true

# React Native
react.dir=../node_modules/react-native/
react.cliDir=../node_modules/react-native/cli.js

# Signing
ANDROID_GRADLE_PLUGIN_VERSION=8.1.4
